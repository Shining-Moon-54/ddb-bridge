name: Publish DDB Bridge experimental alpha
on:
  push:
    branches: [main]
    paths:
      - module.json
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ddb-bridge-release
  cancel-in-progress: false
jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'Publish manifest for') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check && npm test
      - name: Create new draft release (never overwrite an existing version)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$(node -p 'JSON.parse(require("fs").readFileSync("module.json")).version')"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump module version before republishing."
            exit 1
          fi
          gh release create "$tag" --draft --prerelease --target "$GITHUB_SHA" --title "DDB Bridge $tag — experimentelle Alpha" --notes-file docs/RELEASE_NOTES.md
          echo "DDB_BRIDGE_RELEASE_PREPARED=$tag" >> "$GITHUB_ENV"
      - name: Build and upload installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          npm run build -- --repository "$GH_REPO" --tag "$DDB_BRIDGE_RELEASE_PREPARED"
          gh release upload "$DDB_BRIDGE_RELEASE_PREPARED" "dist/ddb-bridge-$DDB_BRIDGE_RELEASE_PREPARED.zip" dist/module.json dist/SHA256SUMS
          gh release edit "$DDB_BRIDGE_RELEASE_PREPARED" --draft=false --prerelease
      - name: Verify anonymous download and ZIP structure
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in 1 2 3 4 5; do
            if node tools/verify-release.mjs "$GH_REPO" "$DDB_BRIDGE_RELEASE_PREPARED"; then exit 0; fi
            sleep 7
          done
          exit 1
      - name: Publish live update manifest only after verification
        run: |
          cp dist/module.json module.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add module.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish manifest for $DDB_BRIDGE_RELEASE_PREPARED"
            git push origin HEAD:main
          fi
